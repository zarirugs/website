name: Publish approved Instagram image and Reel

on:
  schedule:
    # Images: 12:45 IST, with a 13:45 IST retry. Reels: 19:45 IST,
    # with a 20:45 IST retry. Off-hour minutes reduce GitHub cron congestion;
    # each run is locked to one media type and the current India date.
    - cron: "15 7,8 * * *"
    - cron: "15 14,15 * * *"
  workflow_dispatch:
    inputs:
      connection_only:
        description: "Verify the Instagram credentials without publishing"
        required: false
        default: false
        type: boolean
      post_id:
        description: "Approved post ID to publish now (optional)"
        required: false
        type: string
      media_type:
        description: "When no post ID is given, publish today's IMAGE or REELS slot"
        required: false
        type: choice
        options:
          - IMAGE
          - REELS

permissions:
  contents: write

concurrency:
  group: zari-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish one approved daily slot
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and publication tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate content queue
        run: node scripts/marketing/validate-queue.mjs

      - name: Resolve India publication date
        id: schedule
        run: echo "date=$(TZ=Asia/Kolkata date +%F)" >> "$GITHUB_OUTPUT"

      - name: Publish selected image or Reel slot
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
          CONNECTION_ONLY: ${{ inputs.connection_only }}
          POST_ID: ${{ inputs.post_id }}
          PUBLISH_MEDIA_TYPE: ${{ github.event_name == 'schedule' && (github.event.schedule == '15 7,8 * * *' && 'IMAGE' || 'REELS') || inputs.media_type }}
          PUBLISH_DATE: ${{ steps.schedule.outputs.date }}
        run: node scripts/marketing/publish-instagram.mjs
