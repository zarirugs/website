name: Publish approved Instagram content

on:
  schedule:
    # Target 19:30 India time, with periodic recovery checks below.
    - cron: "0 14 * * *"
    # Retry due queue entries every half-hour, away from the busy hour boundary.
    - cron: "7,37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/instagram-publish.yml"
      - "scripts/marketing/*"
      - "marketing/posting-policy.json"
      - "marketing/queue.json"
  workflow_dispatch:
    inputs:
      connection_only:
        description: "Verify the Instagram credentials without publishing"
        required: false
        default: false
        type: boolean
      post_id:
        description: "Approved post ID to check (due time and weekly limit apply)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: zari-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    name: Publish next approved post
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and publication tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate content queue
        run: node scripts/marketing/validate-queue.mjs

      - name: Publish one post
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_VERSION: ${{ vars.INSTAGRAM_GRAPH_VERSION }}
          CONNECTION_ONLY: ${{ github.event_name == 'push' || inputs.connection_only }}
          POST_ID: ${{ inputs.post_id }}
        run: node scripts/marketing/publish-instagram.mjs
